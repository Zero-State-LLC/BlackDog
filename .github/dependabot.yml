version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /faust/worker
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      worker-npm:
        patterns: ["*"]
