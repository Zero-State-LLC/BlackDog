name: Plugin lane smoke
# D-012 VST3 route evidence (ADR-0004). Builds fixtures/plugin/gain.dsp as CLAP
# with faust2clap, wraps it to VST3 with clap-wrapper, then validates.
# The strict CLAP validation is EXPECTED TO FAIL until the upstream faust2clap
# fixes land (uninitialised parameter default; foreign-namespace param events).
on:
  pull_request:
    paths:
      - "fixtures/plugin/**"
      - ".github/workflows/plugin-lane-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  FAUST_SHA: 15a26da0c0b0f893a9f861715c45ba29664c8d22
  CLAP_SHA: a47f6badb49d948fd009998f28309cdab78979c9
  CLAP_HELPERS_SHA: 29389e43489b1af44b654ef5a7b4ee0af4bbc13b
  CLAP_WRAPPER_SHA: 1cca996e96f29ab2be7ae9f8cfe532bbc92e1dd6
  CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
  PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
jobs:
  build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y faust cmake ninja-build g++ unzip
          faust --version
      - name: Fetch pinned sources
        run: |
          fetch() { mkdir -p "$1" && git -C "$1" init -q && git -C "$1" fetch -q --depth 1 "$2" "$3" && git -C "$1" checkout -q FETCH_HEAD; }
          fetch ext/faust https://github.com/grame-cncm/faust "$FAUST_SHA"
          fetch ext/sdk/clap-sdk https://github.com/free-audio/clap "$CLAP_SHA"
          fetch ext/sdk/clap-helpers https://github.com/free-audio/clap-helpers "$CLAP_HELPERS_SHA"
          fetch ext/clap-wrapper https://github.com/free-audio/clap-wrapper "$CLAP_WRAPPER_SHA"
      - name: Build CLAP (faust2clap, with the cstring workaround)
        run: |
          # Pinned checkout headers first: Ubuntu's packaged faust headers are older.
          export CXXFLAGS="-include cstring -include cwchar -I$PWD/ext/faust/architecture"
          mkdir -p work && cp fixtures/plugin/gain.dsp work/
          python3 ext/faust/tools/faust2appls/faust2clap --clap-sdk "$PWD/ext/sdk" --no-install work/gain.dsp
          mkdir -p "$HOME/.clap" && cp work/gain-clap/build/gain.clap "$HOME/.clap/"
      - name: Build VST3 (clap-wrapper)
        run: |
          cmake -S ext/clap-wrapper -B cw-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCLAP_WRAPPER_OUTPUT_NAME=gain -DCLAP_WRAPPER_DOWNLOAD_DEPENDENCIES=ON \
            -DCLAP_SDK_ROOT="$PWD/ext/sdk/clap-sdk"
          cmake --build cw-build
      - name: Fetch validators
        run: |
          mkdir -p tools && cd tools
          curl -fsSLo cv.zip "$CLAP_VALIDATOR_URL" && unzip -q cv.zip && tar xzf clap-validator-*.tar.gz
          curl -fsSLo pv.zip "$PLUGINVAL_URL" && unzip -q pv.zip && chmod +x pluginval
      - name: pluginval VST3 (strictness 10, must pass)
        run: tools/pluginval --strictness-level 10 --validate-in-process --validate cw-build/Release/gain.vst3
      - name: clap-validator (strict, EXPECTED TO FAIL until upstream fix)
        continue-on-error: true
        run: |
          "$(find tools -name clap-validator -type f | head -n 1)" validate work/gain-clap/build/gain.clap
