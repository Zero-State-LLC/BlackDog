name: Spec structure
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required docs
        run: |
          test -s README.md
          test -s KANBAN.md
          test -s specs/001-faustcoder/spec.md
          test -s docs/adr/0001-dag-evidence.md
  spec-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Spec Kit structure
        run: ./scripts/check-spec-kit.sh
  # Same workflow file as the spec checks (spec §16). Not a new CI path.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: faust/worker/package-lock.json
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      # npm downloads faustwasm. The compiler subprocess is started with
      # unshare --net and cannot use that network. Faust 2.88.0 is installed
      # below so the masked native compile runs in this job.
      - name: Install Faust worker
        working-directory: faust/worker
        run: npm ci --ignore-scripts
      - name: Fetch pinned faustlibraries
        run: ./scripts/fetch-faustlibraries.sh
      - name: Fetch Faust 2.88.0 examples
        run: ./scripts/fetch-faust-examples.sh
      # GitHub-hosted Ubuntu blocks unprivileged user namespaces, so
      # `unshare --net --map-current-user` fails with EPERM on uid_map.
      # The sysctl is host-wide. Set it only on ephemeral github-hosted
      # runners. Sparks use /opt/faustcoder/bin/fc-unshare
      # (docs/runbooks/compiler-harness.md), never this sysctl. CI leaves
      # FAUSTCODER_UNSHARE unset and uses the system unshare.
      - name: Allow the compiler network namespace
        if: runner.environment == 'github-hosted'
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check the compiler network namespace
        run: unshare --net --map-current-user -- true
      # Faust 2.88.0 compiler only (no LLVM). The planted-prefix import test needs it.
      # GitHub-hosted Ubuntu leaves /usr/local/bin mode 0777. The installer
      # refuses to create <prefix>/bin/architecture under a world-writable
      # parent that is not root-owned and sticky. Tighten the directory
      # before the script runs. The script still refuses if this is skipped.
      - name: Tighten the Faust prefix bin directory
        run: |
          if [ -d /usr/local/bin ]; then
            sudo chmod 755 /usr/local/bin
          fi
      - name: Install Faust 2.88.0
        run: ./scripts/install-faust-2.88.0.sh
      - name: Test
        run: python -m pytest
