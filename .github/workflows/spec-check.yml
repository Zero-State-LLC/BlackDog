name: Spec structure
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required docs
        run: |
          test -s README.md
          test -s KANBAN.md
          test -s specs/001-faustcoder/spec.md
          test -s docs/adr/0001-dag-evidence.md
  spec-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Spec Kit structure
        run: ./scripts/check-spec-kit.sh
  # Same workflow file as the spec checks (spec §16). Not a new CI path.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Test
        run: python -m pytest
