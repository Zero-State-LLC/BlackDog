name: T04 x86 diagnostic
on:
  push:
    branches: [diag/t04-x86-node2214]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
      - name: Install Python dependencies
        run: python -m pip install -e .
      - name: Install pinned Faust WASM
        working-directory: faust/worker
        run: npm ci --ignore-scripts
      - name: Verify namespace support without sudo
        run: unshare --net --map-current-user -- true
      - name: Capture samples and WASM
        run: python diagnostics/t04_capture.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t04-x86-node2214
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
