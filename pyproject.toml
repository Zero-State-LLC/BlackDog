[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faustcoder"
version = "0.0.0"
description = "Artifact store, sandboxed Faust compiler harness, dataset rights transitions, and the DGX Spark env_verified probe."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
]
dev = [
  "pytest>=8.3",
]

[project.scripts]
faustcoder-spark-probe = "faustcoder.spark_probe:main"

[tool.setuptools.packages.find]
include = ["faustcoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--strict-markers"]
