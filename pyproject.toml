[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faustcoder"
version = "0.0.0"
description = "Artifact store, sandboxed Faust compiler and DSP signal harness, dataset rights transitions, T06 dedup snapshot, and the DGX Spark env_verified probe."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
tokenizer = ["tokenizers==0.23.3"]
test = [
  "tokenizers==0.23.3",
  "pytest>=8.3",
  "rfc3339-validator>=0.1.4",
]
dev = [
  "pytest>=8.3",
]

[project.scripts]
faustcoder-spark-probe = "faustcoder.spark_probe:main"
faustcoder-snapshot = "faustcoder.cli:main"

[tool.setuptools.packages.find]
include = ["faustcoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--strict-markers"]
